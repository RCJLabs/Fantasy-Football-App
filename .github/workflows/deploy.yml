name: deploy

# Builds the PWA plus the daily data files and publishes both to GitHub Pages.
# Requires Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  schedule:
    # GitHub runs scheduled workflows as the account that last changed these cron lines. Commits authored by
    # the session's bot account (no access to this repo) never fired, so edit them from an owner account.
    - cron: '7 16 * * *'  # daily at ~12:07 ET (after Sunday's early inactives in EDT)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build app
        run: npm run build
      - id: day
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # Sleeper asks for the full players dump at most once a day: reuse today's copy across deploys.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: sleeper-players-${{ steps.day.outputs.date }}
      - name: Build data files
        run: npm run data -- --out dist/data --cache .cache
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: true # keeps /.well-known/ (TWA asset links) once added

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
