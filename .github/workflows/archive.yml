name: archive

# Encrypted snapshots of inputs that can't be recreated later (see scripts/archive/snapshot.sh).
# Times are UTC; the Sunday and Mon/Thu slots sit before ET kickoffs in both EDT and EST.
on:
  schedule:
    # GitHub runs scheduled workflows as the account that last changed these cron lines. Commits authored by
    # the session's bot account (no access to this repo) never fired, so edit them from an owner account.
    - cron: '17 */4 * * *'    # every 4 hours
    - cron: '42 23 * * 0,1,4' # before SNF (EDT), MNF and TNF
    - cron: '47 15 * * 0'     # Sunday ~11:47 EDT / 10:47 EST
    - cron: '47 16 * * 0'     # Sunday ~12:47 EDT / 11:47 EST
    - cron: '47 19 * * 0'     # Sunday ~3:47 pm EDT / 2:47 pm EST, after the 4 pm games' inactives
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = current and next week; full = all remaining weeks, players dump, injuries'
        type: choice
        options: [auto, full]
        default: auto
      props:
        description: 'auto = games kicking off within 6 hours; test = the next game, not marked as fetched; off'
        type: choice
        options: [auto, test, off]
        default: auto

permissions:
  contents: write # create the monthly release and upload assets

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install age
        run: |
          curl -sSL -o "$RUNNER_TEMP/age.tgz" https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
          echo "7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50  $RUNNER_TEMP/age.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/age.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"

      # The prediction ledger hook needs Node; if setup fails the snapshot still runs, without predictions.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        continue-on-error: true
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (prediction ledger)
        id: deps
        continue-on-error: true
        run: npm ci --no-audit --no-fund

      - name: Snapshot, predict, encrypt, upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE_MODE: ${{ inputs.mode || 'auto' }}
          SNAPSHOT_HOOK: ${{ steps.deps.outcome == 'success' && 'npx --no-install tsx scripts/ledger/predict.ts' || '' }}
          # Player props (docs/props.md): the key reaches only the props hook.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PROPS_MODE: ${{ inputs.props || 'auto' }}
          PROPS_HOOK: ${{ steps.deps.outcome == 'success' && 'npx --no-install tsx scripts/props/pull.ts' || '' }}
        run: bash scripts/archive/snapshot.sh

  ledger:
    # Scores each finished week of the prediction ledger and publishes the aggregates to the `ledger` release,
    # which the data build copies to the site (docs/ledger.md). Independent of the snapshot job. The archive key
    # decrypts only this job's predictions; nothing per player is printed or uploaded. Skips without the secret.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install age
        run: |
          curl -sSL -o "$RUNNER_TEMP/age.tgz" https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
          echo "7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50  $RUNNER_TEMP/age.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/age.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Score finished weeks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE_AGE_KEY: ${{ secrets.ARCHIVE_AGE_KEY }}
        run: bash scripts/ledger/auto.sh
