name: archive

# Encrypted snapshots of inputs that can't be recreated later (see scripts/archive/snapshot.sh).
# Times are UTC; the Sunday and Mon/Thu slots sit before ET kickoffs in both EDT and EST.
on:
  schedule:
    - cron: '17 */4 * * *'   # every 4 hours
    - cron: '42 23 * * 1,4'  # before MNF / TNF
    - cron: '47 15 * * 0'    # Sunday ~11:47 EDT / 10:47 EST
    - cron: '47 16 * * 0'    # Sunday ~12:47 EDT / 11:47 EST
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = current and next week; full = all remaining weeks, players dump, injuries'
        type: choice
        options: [auto, full]
        default: auto

permissions:
  contents: write # create the monthly release and upload assets

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install age
        run: |
          curl -sSL -o "$RUNNER_TEMP/age.tgz" https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
          echo "7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50  $RUNNER_TEMP/age.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/age.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"

      - name: Snapshot, encrypt, upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE_MODE: ${{ inputs.mode || 'auto' }}
        run: bash scripts/archive/snapshot.sh
