name: keepalive

# GitHub disables scheduled workflows in public repos after 60 days without repository activity,
# which would stop the archive and daily data refresh mid-season. A monthly commit prevents that.
on:
  schedule:
    # GitHub runs scheduled workflows as the account that last changed these cron lines. Commits authored by
    # the session's bot account (no access to this repo) never fired, so edit them from an owner account.
    - cron: '23 6 1 * *' # monthly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Commit a timestamp
        run: |
          date -u +%FT%TZ > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "Keep scheduled workflows alive"
          git push
