name: data-check

# Runs the data pipeline against live Sleeper/nflverse without publishing, whenever pipeline code
# changes (CI stays independent of upstream outages otherwise).
on:
  pull_request:
    paths: ['pipeline/**', 'app/src/data/contracts.ts', 'app/src/sleeper/raw.ts', '.github/workflows/data.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: day
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: sleeper-players-${{ steps.day.outputs.date }}
      - name: Build data files (not published)
        run: npm run data -- --out out/data --cache .cache
      - name: Summarize
        run: |
          {
            echo "### Data pipeline check"
            echo
            jq -r '"- players.json: \(.players | length) players, \([.players[] | select(.prac)] | length) with practice status (report week \(.injuryReportWeek // "-")), season \(.season) week \(.week)"' out/data/players.json
            jq -r '"- schedule.json: \(.games | length) games, \([.games[] | select(.homeImplied != null)] | length) with implied totals"' out/data/schedule.json
            [ -f out/data/usage.json ] && jq -r '"- usage.json: \(.players | length) players, weeks \(.weeks | map(tostring) | join(", "))"' out/data/usage.json
            ls -l out/data | awk 'NR>1 {print "- " $9 ": " $5 " bytes"}'
          } | tee -a "$GITHUB_STEP_SUMMARY"
