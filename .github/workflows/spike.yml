name: spike

# Phase 0 checks against live Sleeper endpoints (CORS, shapes, coverage). Output goes to the job summary
# and contains metadata and aggregates only, because logs of this public repo are public.
on:
  workflow_dispatch: # league-specific checks run privately via league-pull.yml instead
    inputs:
      checks:
        description: 'all = CORS + Sleeper data (fetches the players dump) + FantasyCalc; light = CORS + FantasyCalc only'
        type: choice
        options: [all, light]
        default: light

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: CORS checks
        run: bash scripts/spike/cors.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Data checks
        if: inputs.checks == 'all'
        run: node scripts/spike/sleeper-spike.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: FantasyCalc checks
        run: node scripts/spike/fantasycalc-spike.mjs | tee -a "$GITHUB_STEP_SUMMARY"
