name: spike

# Phase 0 checks against live Sleeper endpoints (CORS, shapes, coverage). Output goes to the job summary
# and contains metadata and aggregates only, because logs of this public repo are public.
on:
  workflow_dispatch: # league-specific checks run privately via league-pull.yml instead
    inputs:
      checks:
        description: 'all = CORS + Sleeper data (fetches the players dump) + FantasyCalc; light = CORS + FantasyCalc only; live = game-day feeds, polled while games are on; plays = ESPN game summaries (scoring plays) of games under way'
        type: choice
        options: [all, light, live, plays]
        default: light
      minutes:
        description: 'live only: minutes to poll (one poll a minute)'
        type: string
        default: '50'

permissions:
  contents: read

jobs:
  spike:
    if: inputs.checks != 'live'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: CORS checks
        if: inputs.checks != 'plays'
        run: bash scripts/spike/cors.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Data checks
        if: inputs.checks == 'all'
        run: node scripts/spike/sleeper-spike.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: FantasyCalc checks
        if: inputs.checks != 'plays'
        run: node scripts/spike/fantasycalc-spike.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: ESPN news checks
        if: inputs.checks != 'plays'
        run: node scripts/spike/espn-news-spike.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: ESPN scoring plays checks
        if: inputs.checks == 'plays'
        run: node scripts/spike/espn-plays-spike.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  # Game-day feeds (Sleeper stats, ESPN scoreboard and game summary), polled once a minute while games are on.
  live:
    if: inputs.checks == 'live'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Live game-day checks
        env:
          MINUTES: ${{ inputs.minutes }}
        run: node scripts/spike/live-gameday-spike.mjs | tee -a "$GITHUB_STEP_SUMMARY"
